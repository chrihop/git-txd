name: git-txd
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test -- --maxWorkers=1 --testTimeout=60000 --hookTimeout=60000
      - run: npm run test:package
